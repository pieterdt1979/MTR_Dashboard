services:
  mysql:
    image: mysql:9.2
    container_name: mtr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: mtr-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: mtr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtr_state}
      POSTGRES_USER: ${POSTGRES_USER:-mtr_state_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtr_state_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtr_state_user} -d ${POSTGRES_DB:-mtr_state}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mtr-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtr-backend
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MONGODB_URI: mongodb://127.0.0.1:${MONGODB_PORT:-27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION}
      MONGODB_FPING_COLLECTION: ${MONGODB_FPING_COLLECTION:-fping_status}
      MONGODB_FPING_HISTORY_COLLECTION: ${MONGODB_FPING_HISTORY_COLLECTION:-fping_results}
      MONGODB_REALTIME_FPING_COLLECTION: ${MONGODB_REALTIME_FPING_COLLECTION:-fping_realtime_results}
      MONGODB_REALTIME_SESSION_COLLECTION: ${MONGODB_REALTIME_SESSION_COLLECTION:-realtime_probe_sessions}
      MONGODB_PROBE_REQUEST_COLLECTION: ${MONGODB_PROBE_REQUEST_COLLECTION:-probe_requests}
      MONGODB_REALTIME_TTL_SECONDS: ${MONGODB_REALTIME_TTL_SECONDS:-86400}
      POLLING_INTERVAL_MINUTES: ${POLLING_INTERVAL_MINUTES}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS}
      MTR_COUNT: ${MTR_COUNT}
      MTR_PROBE_MODE: ${MTR_PROBE_MODE:-icmp}
      MTR_TCP_PORT: ${MTR_TCP_PORT:-443}
      MTR_UDP_PORT: ${MTR_UDP_PORT:-33434}
      FPING_COUNT: ${FPING_COUNT:-3}
      FPING_INTERVAL_MS: ${FPING_INTERVAL_MS:-10}
      FPING_PERIOD_MS: ${FPING_PERIOD_MS:-500}
      FPING_TIMEOUT_SECONDS: ${FPING_TIMEOUT_SECONDS:-40}
      MTR_FORCE_INTERVAL_MINUTES: ${MTR_FORCE_INTERVAL_MINUTES:-60}
      MTR_JITTER_THRESHOLD_MS: ${MTR_JITTER_THRESHOLD_MS:-5}
      MTR_CONSECUTIVE_BREACHES: ${MTR_CONSECUTIVE_BREACHES:-2}
      MTR_TRIGGER_COOLDOWN_MINUTES: ${MTR_TRIGGER_COOLDOWN_MINUTES:-15}
      MTR_BASELINE_ALPHA: ${MTR_BASELINE_ALPHA:-0.2}
      MTR_MAX_WORKERS: ${MTR_MAX_WORKERS:-10}
      REALTIME_MAX_ACTIVE_SESSIONS: ${REALTIME_MAX_ACTIVE_SESSIONS:-5}
      MTR_DISPATCH_MODE: ${MTR_DISPATCH_MODE:-direct}
      MTR_JOB_QUEUE: ${MTR_JOB_QUEUE:-mtr_jobs}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://set-rabbitmq-user:set-rabbitmq-password@127.0.0.1:${RABBITMQ_PORT:-5672}/%2f}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-mtr_state_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-strong-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-mtr_state}
      POSTGRES_STATE_TABLE: ${POSTGRES_STATE_TABLE:-device_probe_state}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FILE: ${LOG_FILE}
    command: ["python", "mtr_poller.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtr-frontend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION}
      MONGODB_FPING_HISTORY_COLLECTION: ${MONGODB_FPING_HISTORY_COLLECTION:-fping_results}
      MONGODB_REALTIME_FPING_COLLECTION: ${MONGODB_REALTIME_FPING_COLLECTION:-fping_realtime_results}
      MONGODB_REALTIME_SESSION_COLLECTION: ${MONGODB_REALTIME_SESSION_COLLECTION:-realtime_probe_sessions}
      MONGODB_PROBE_REQUEST_COLLECTION: ${MONGODB_PROBE_REQUEST_COLLECTION:-probe_requests}
      REALTIME_MAX_ACTIVE_SESSIONS: ${REALTIME_MAX_ACTIVE_SESSIONS:-5}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SECURITY_ENFORCE_AUTH: ${SECURITY_ENFORCE_AUTH:-true}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-12}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-replace-with-strong-admin-password}
      AUTH_OPERATOR_USERNAME: ${AUTH_OPERATOR_USERNAME:-operator}
      AUTH_OPERATOR_PASSWORD: ${AUTH_OPERATOR_PASSWORD:-replace-with-strong-operator-password}
      AUTH_VIEWER_USERNAME: ${AUTH_VIEWER_USERNAME:-viewer}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:-replace-with-strong-viewer-password}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: ["npm", "run", "start"]

volumes:
  mysql_data:
  mongo_data:
  postgres_data:
